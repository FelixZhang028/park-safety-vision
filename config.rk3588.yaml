model:
  backend: rknn
  path: models/yolo11n_fp16.rknn
  confidence: 0.35
  iou: 0.50
  image_size: 640
  device: cpu
  npu_core: auto
  classes: [0, 2, 3, 5, 7]

tracking:
  tracker: bytetrack
  persist: true
  track_low_threshold: 0.10
  match_iou_threshold: 0.30
  track_buffer_frames: 30

display:
  show_window: false
  window_name: Safety Vision Tracking
  line_width: 2

output:
  directory: outputs
  save_video: true
  save_jsonl: true
  video_name: tracked.mp4
  jsonl_name: tracks.jsonl
  metrics_name: metrics.jsonl
  events_name: events.jsonl
  summary_name: summary.json
  event_images_directory: events

runtime:
  reconnect_attempts: 10
  reconnect_delay_seconds: 2.0
