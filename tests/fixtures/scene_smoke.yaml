scene:
  id: qa_smoke

regions:
  people:
    polygon: [[0, 0], [1, 0], [1, 1], [0, 1]]
  traffic:
    polygon: [[0, 0], [1, 0], [1, 1], [0, 1]]
  parking:
    polygon: [[0, 0], [1, 0], [1, 1], [0, 1]]
  fire:
    polygon: [[0, 0], [1, 0], [1, 1], [0, 1]]

lines:
  entry:
    points: [[0.1, 0.5], [0.9, 0.5]]
    in_direction: negative_to_positive

rules:
  person_count:
    enabled: true
    region: people
    lines: [entry]
  congestion:
    enabled: true
    region: traffic
    min_vehicles: 1
    max_speed_ratio: 0.02
    min_low_speed_ratio: 1.0
    hold_seconds: 0.2
    recovery_seconds: 0.2
  illegal_parking:
    enabled: true
    region: parking
    max_speed_ratio: 0.02
    hold_seconds: 0.4
    recovery_seconds: 0.2
    suppress_when_congested: false
  fire_lane:
    enabled: true
    region: fire
    max_speed_ratio: 0.02
    hold_seconds: 0.3
    recovery_seconds: 0.2

analytics:
  history_seconds: 1
  stale_track_seconds: 1
  metrics_interval_seconds: 0.2

