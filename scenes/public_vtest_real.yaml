scene:
  id: opencv_vtest_real

regions:
  people_area:
    polygon: [[0.01, 0.01], [0.99, 0.01], [0.99, 0.99], [0.01, 0.99]]
  no_parking_area:
    polygon: [[0.82, 0.02], [0.995, 0.02], [0.995, 0.25], [0.82, 0.25]]
  fire_lane:
    polygon: [[0.82, 0.02], [0.995, 0.02], [0.995, 0.25], [0.82, 0.25]]
  visitor_watch_area:
    polygon: [[0.01, 0.01], [0.99, 0.01], [0.99, 0.99], [0.01, 0.99]]

lines: {}

rules:
  person_count:
    enabled: true
    region: people_area
    lines: []
  congestion:
    enabled: false
  illegal_parking:
    enabled: true
    region: no_parking_area
    max_speed_ratio: 0.005
    hold_seconds: 5
    recovery_seconds: 1
    suppress_when_congested: false
  fire_lane:
    enabled: true
    region: fire_lane
    max_speed_ratio: 0.005
    hold_seconds: 5
    recovery_seconds: 1
  visitor_loitering:
    enabled: true
    include_roles: [visitor, unknown]
    period: day
    day_start: "06:00"
    night_start: "18:00"
    zones:
      - region: visitor_watch_area
        day_hold_seconds: 5
        night_hold_seconds: 3
        absence_grace_seconds: 1
        recovery_seconds: 1

analytics:
  history_seconds: 2
  stale_track_seconds: 2
  metrics_interval_seconds: 1
